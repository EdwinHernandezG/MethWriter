# Bruker Ultima 2P (multiphoton laser-scanning)
#
# PrairieView writes most acquisition settings to a companion XML, which the
# tool reads automatically. What it does NOT record is the hardware identity:
# fill that in here once.
key: bruker_ultima_2p
label: Bruker Ultima 2P (two-photon)

match:
  instrument_key: [bruker_ultima_2p]
  fingerprint_contains: [prairie, bruker, ultima]

