[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micromethods"
version = "0.1.0"
description = "Extract microscopy metadata and draft QUAREP-LiMi compliant methods sections"
requires-python = ">=3.9"
dependencies = [
  "tifffile>=2023.7.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
zeiss = ["pylibCZIrw>=4.0"]
leica = ["readlif>=0.6.5"]
ome = ["ome-types>=0.4"]
napari = ["napari>=0.4.18", "qtpy"]
all = ["pylibCZIrw>=4.0", "readlif>=0.6.5", "ome-types>=0.4"]

[project.scripts]
micromethods = "micromethods.cli:main"

[project.entry-points."napari.manifest"]
micromethods = "micromethods._napari:napari.yaml"

# Explicit, not auto-discovery: if pip is run from the wrong directory, an
# explicit list fails loudly at build time instead of installing an empty
# distribution whose entry points resolve but whose modules do not exist.
[tool.setuptools]
packages = [
  "micromethods",
  "micromethods.readers",
  "micromethods._napari",
  "micromethods.instrument_profiles",
]

[tool.setuptools.package-data]
"micromethods._napari" = ["napari.yaml"]
"micromethods.instrument_profiles" = ["*.yaml"]
