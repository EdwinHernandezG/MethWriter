# micromethods - full environment (CLI + napari plugin)
#
#   conda env create -f environment.yml      # run from the repository root
#   conda activate micromethods
#
# Everything that ships binaries comes from conda-forge; the two proprietary
# vendor readers are pip-only and go in the pip section below.
name: micromethods

channels:
  - conda-forge

dependencies:
  # --- interpreter -------------------------------------------------------
  # napari supports 3.10-3.12; 3.11 is the safest middle ground.
  - python=3.11
  - pip

  # --- core ---------------------------------------------------------------
  - numpy
  - tifffile>=2023.7.10
  - imagecodecs          # TIFF codecs (LZW/deflate/zstd) - Blaze files need these
  - pyyaml>=6.0
  - lxml                 # faster XML, and required by aicspylibczi if you use it

  # --- napari plugin ------------------------------------------------------
  - napari>=0.5
  - pyqt                 # Qt binding; swap for pyside6 if you prefer
  - npe2                 # plugin manifest tooling, used for verification

  # --- optional but recommended ------------------------------------------
  - ome-types>=0.4       # OME-XML model, used to validate awkward OME-TIFFs

  # --- pip-only -----------------------------------------------------------
  - pip:
      - readlif>=0.6.5     # Leica .lif / .lof
      - pylibCZIrw>=4.0    # Zeiss .czi  (see INSTALL.md if this wheel is missing)
      # - aicspylibczi>=3.1  # alternative Zeiss reader
      # - czifile            # last-resort Zeiss reader, pure Python
      - -e .               # micromethods itself, editable
