name: CI

# The failure this guards against: `pip install -e .` can succeed while
# installing no importable package, which makes the napari plugin silently
# absent. The import check and the manifest check below both fail loudly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Package must be importable, not just installed
        run: |
          python -c "import micromethods, pathlib; print(pathlib.Path(micromethods.__file__).parent)"
          python -c "import micromethods.readers, micromethods.readers.imspector"

      - name: napari manifest must resolve
        run: |
          python -c "from npe2 import PluginManifest; m = PluginManifest.from_distribution('micromethods'); assert m.contributions.widgets, 'no widget contribution'; print(m.name, [w.display_name for w in m.contributions.widgets])"

      - name: Console script must run
        run: |
          micromethods --help
          micromethods profiles

      - name: Installation self-check
        run: micromethods doctor

      - name: Tests
        run: pytest
