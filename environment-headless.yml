# micromethods - headless environment (CLI only, no Qt, no napari)
#
# For servers, cron jobs and pre-deposition checks where a GUI would only
# drag in Qt. Use environment.yml instead if you want the napari plugin.
#
#   conda env create -f environment-headless.yml
#   conda activate micromethods-headless
name: micromethods-headless

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - numpy
  - tifffile>=2023.7.10
  - imagecodecs
  - pyyaml>=6.0
  - lxml
  - ome-types>=0.4
  - pip:
      - readlif>=0.6.5
      - pylibCZIrw>=4.0
      - -e .
